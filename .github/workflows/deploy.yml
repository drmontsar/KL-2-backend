name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/klinik-backend:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/klinik
            cd /opt/klinik

            cat > .env.production <<'EOF'
            NODE_ENV=production
            PORT=3001
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            EOF

            docker pull ghcr.io/${{ github.repository_owner }}/klinik-backend:${{ github.sha }}
            docker stop klinik-backend || true
            docker rm klinik-backend || true
            docker run -d \
              --name klinik-backend \
              --restart unless-stopped \
              --env-file .env.production \
              -p 3001:3001 \
              ghcr.io/${{ github.repository_owner }}/klinik-backend:${{ github.sha }}
